name: axiova_x
description: AxiovaX Gaming Tournament Management App - A comprehensive platform for organizing and managing competitive gaming tournaments with real money prizes, player wallets, and admin controls.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & BLoC
  flutter_bloc: ^8.1.0
  bloc: ^8.1.0
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  firebase_firestore: ^4.14.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0
  firebase_messaging: ^14.6.0
  
  # API & HTTP
  http: ^1.1.0
  dio: ^5.3.0
  
  # Payment Gateway
  razorpay_flutter: ^1.3.0
  
  # Phone Authentication
  firebase_phone_auth_handler: ^1.1.0
  
  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  
  # Image & Media
  image_picker: ^1.0.0
  video_player: ^2.7.0
  
  # Networking & Connectivity
  connectivity_plus: ^5.0.0
  
  # GetIt for Dependency Injection
  get_it: ^7.6.0
  
  # Freezed for models
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  
  # API client generation
  retrofit: ^4.1.0
  
  # Localization
  easy_localization: ^3.0.0
  
  # Date/Time
  intl: ^0.19.0
  
  # Charts (for stats)
  fl_chart: ^0.63.0
  
  # Animation
  lottie: ^2.4.0
  
  # Device Info
  device_info_plus: ^10.0.0
  
  # Permission handling
  permission_handler: ^11.0.0
  
  # QR Code Scanner
  qr_code_scanner: ^1.0.0
  
  # PDF export
  pdf: ^3.10.0
  
  # Pretty logging
  logger: ^2.1.0
  
  # Cupertino Icons
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^2.0.0
  
  # Build runners
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  retrofit_generator: ^7.0.0
  
  # Testing
  mockito: ^5.4.0
  bloc_test: ^9.1.0
  
  # Code generation
  dart_code_metrics: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/logos/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
